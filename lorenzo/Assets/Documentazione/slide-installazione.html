<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prima di cominciare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,600&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Slide di installazione: Unity, import del kit, lavoro in squadra, 22 minuti. Stile di docs/lezione-unity-heritage.html.
   Frecce o spazio: avanti/indietro. N: note del docente. G: griglia. Le slide sono generate dai dati in fondo al file. */
:root{--paper:#f4f4f1;--paper-2:#e9e9e5;--ink:#1b1b1b;--soft:#585858;--mid:#8c8c8c;--line:#d2d2cc;--r:10px;
--fd:'Fraunces',Georgia,serif;--fb:'Inter',system-ui,sans-serif;--fm:'Space Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#2a2a28;overflow:hidden}
body{font-family:var(--fb);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;top:50%;left:50%;width:1280px;height:720px;transform-origin:center}
.s{position:absolute;inset:0;background:var(--paper);padding:48px 72px 56px;display:none;flex-direction:column;overflow:hidden}
.s.on{display:flex}
.s::after{content:attr(data-n);position:absolute;right:28px;bottom:18px;font-family:var(--fm);font-size:12px;color:var(--mid)}
.k{font-family:var(--fm);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:22px;display:flex;justify-content:space-between}
h1{font-family:var(--fd);font-weight:900;font-size:104px;line-height:.92;letter-spacing:-.02em;text-shadow:4px 4px 0 rgba(0,0,0,.12)}
h2{font-family:var(--fd);font-weight:900;font-size:46px;line-height:1.05;margin-bottom:22px}
h1,h2,h3,.say{text-wrap:balance}p,dd,td,.aside{text-wrap:pretty}
h1 em,h2 em{font-style:italic;font-weight:600;color:#3a3a3a}
h3{font-family:var(--fd);font-weight:600;font-size:21px;line-height:1.2;margin-bottom:2px}
p{font-size:20px;line-height:1.5;max-width:62ch}
p+p,p+.defs,p+.steps,p+table,.defs+p,table+p,.steps+p{margin-top:12px}
.lead{font-family:var(--fd);font-style:italic;font-size:26px;color:var(--soft);max-width:36ch;line-height:1.4}
code{font-family:var(--fm);font-size:.82em;background:var(--paper-2);padding:1px 6px;border-radius:4px;white-space:nowrap}
b{font-weight:600}
/* Pieni e vuoti: il titolo resta fisso in alto, il contenuto si centra nello spazio sotto (centro ottico, un po' più in alto). */
.row{display:flex;gap:44px;flex:1;min-height:0;align-items:center;padding-bottom:28px}.row>*{min-width:0}
.row>.shot,.row>.fig:has(.img:not(.fit)),.row>.img{align-self:stretch}
.solo{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1040px;padding-bottom:28px}
.solo p{font-size:27px;line-height:1.45;max-width:40ch}.solo p+p{margin-top:18px}
.solo .defs>*{font-size:23px;padding:15px 0}.solo .defs dt{padding-right:40px}
.solo .steps{gap:12px}.solo .step{padding:14px 20px 14px 70px}.solo .step::before{font-size:38px;left:20px}.solo .step h3{font-size:24px}.solo .step p{font-size:19px}
.solo table{font-size:20px}.solo th,.solo td{padding:13px 16px}.solo .warn{font-size:21px;max-width:52ch}
.img.fit.up img{width:100%}
.vis{flex:1;display:flex;flex-direction:column;justify-content:center}.txt{flex:1}
.vis>svg{max-height:100%}
.shot{flex:1;border:2px dashed var(--soft);border-radius:var(--r);background:var(--paper-2) radial-gradient(rgba(0,0,0,.06) 1px,transparent 1px) 0 0/9px 9px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-family:var(--fm);font-size:14px;color:var(--soft);line-height:1.5}
.shot b{display:block;color:var(--ink);font-size:12px;letter-spacing:.15em;margin-bottom:6px}
.fig{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}.fig>.img{flex:1}.fig>.cap{font-size:11px}
.gridn{display:grid;gap:14px;flex:0 1 auto;min-height:0;align-items:start}.gridn .fig{min-height:0}.gridn .img{flex:0 1 auto;max-height:300px;min-height:0}.gridn .fig>.cap{font-size:12px}
.img{flex:1;border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--paper-2);display:flex;min-height:0}
.img img{width:100%;height:100%;object-fit:cover}
.img.fit{border:0;border-radius:0;background:none;align-items:center;justify-content:center}
.img.fit img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;border:2px solid var(--ink);border-radius:8px;background:#fff}
.fig:has(.img.fit)>.cap{text-align:center}
.fig:has(.img.fit){justify-content:flex-start}.fig>.img.fit{flex:0 1 auto;min-height:0;display:block;text-align:center}
.img.fit img{display:inline-block;vertical-align:top}.wide>.fig{flex:0 1 auto!important}
.img.fit img{max-height:470px}.wide .img.fit img{max-height:290px}.gridn .img.fit img{max-height:220px}.vis .fig .img.fit img{max-height:190px}
.cap{font-family:var(--fm);font-size:13px;color:var(--soft);line-height:1.5}
.steps{counter-reset:p;display:flex;flex-direction:column;gap:9px}
.steps.cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px}
.step{position:relative;padding:9px 16px 9px 56px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper)}
.step::before{counter-increment:p;content:counter(p);position:absolute;left:16px;top:5px;font-family:var(--fd);font-weight:900;font-size:30px;color:transparent;-webkit-text-stroke:1.3px var(--ink)}
.step p{font-size:17px;line-height:1.4}
.defs{display:grid;grid-template-columns:auto 1fr;border-top:2px solid var(--ink)}
.defs>*{padding:10px 0;border-bottom:1px solid var(--line);font-size:19px;line-height:1.45}
.defs dt{font-family:var(--fd);font-weight:600;padding-right:26px;white-space:nowrap}
.warn{border-left:5px solid var(--ink);background:var(--paper-2);padding:11px 18px;border-radius:0 var(--r) var(--r) 0;font-size:18px;line-height:1.45;margin-top:16px}
.warn::before{content:'ATTENZIONE';display:block;font-family:var(--fm);font-size:11px;letter-spacing:.18em;color:var(--soft);margin-bottom:2px}
.warn.tip::before{content:'IN BREVE'}
.aside{color:var(--soft);margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}.defs+.aside,table+.aside{border-top:0;padding-top:0;margin-top:18px}.solo .aside{font-size:21px}
.say{font-family:var(--fd);font-weight:600;font-size:58px!important;line-height:1.12!important;letter-spacing:-.01em;max-width:21ch!important}
table{border-collapse:collapse;width:100%;font-size:17px}th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}
th{font-family:var(--fm);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--paper)}
td:first-child{white-space:nowrap;font-weight:600}
svg{display:block;width:100%;height:auto}svg text{font-family:var(--fm);font-size:15px;fill:var(--ink)}
.wide>.vis:has(.chain)+div{margin-top:30px}
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:2px solid var(--ink);margin-top:8px}.chain>div{position:relative;padding:22px 32px 0 0}.chain>div::before{content:'';position:absolute;top:-8px;left:0;width:14px;height:14px;border-radius:50%;background:var(--ink)}.chain h3{font-size:36px;font-weight:900;margin-bottom:8px}.chain p{font-size:19px;color:var(--soft)}
.flow{display:flex;align-items:stretch}.flow>.fb{flex:1;border:2px solid var(--ink);border-radius:var(--r);padding:16px 18px;background:var(--paper)}
.flow>.fb.d{background:var(--ink);color:var(--paper)}.flow>.fb.d .cap{color:#c9c9c4}
.flow>.ar{flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:22px}
.fb p{font-size:17px}
.comp{display:flex;flex-direction:column;gap:10px;border:2px solid var(--ink);border-radius:var(--r);padding:18px}
.comp .r{display:flex;align-items:center;gap:12px;border:1.5px solid var(--ink);border-radius:8px;padding:11px 15px;font-family:var(--fm);font-size:15px;background:var(--paper-2);cursor:pointer}
.comp .r.on{background:var(--ink);color:var(--paper)}
.cb{flex:0 0 16px;width:16px;height:16px;border:1.5px solid var(--ink);border-radius:3px;background:var(--paper);position:relative}
.cb.x{cursor:pointer}.cb.sp{visibility:hidden}.r.on .cb{border-color:var(--paper)}
.cb.t::after{content:'';position:absolute;left:3.5px;top:-.5px;width:4px;height:9px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(40deg)}
/* Slide a passi: tutti i pannelli stanno nel DOM, uno solo è visibile. */
.pns{display:grid;align-content:center;flex:1}.pn{grid-area:1/1;visibility:hidden}.pn.on{visibility:visible}
.pn h3{margin-bottom:8px}.pn .p0{font-family:var(--fd);font-weight:600;font-size:30px;line-height:1.25;max-width:14ch}
.arimg{flex:0 0 62%;position:relative;border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--paper-2)}.arimg img{display:block;width:100%;height:auto}
.arz{position:relative;transform-origin:0 0;transition:transform .4s ease}
.ab{position:absolute;display:block;padding:0;border:0;background:transparent;cursor:pointer}
.ab.sel{z-index:2;outline:3px solid var(--ink);outline-offset:-3px;box-shadow:0 0 0 2000px rgba(244,244,241,.65)}
.pt{display:grid;grid-template-columns:270px 420px 1fr;gap:28px;align-items:center}
.pv svg .mesh,.pv svg .flame,.pv svg .col,.pv svg .pl{transition:opacity .2s,transform .35s}
.pv svg.nomesh .mesh,.pv svg.nomesh .flame,.pv svg.nosw .flame,.pv svg.nocol .col{opacity:0}.pv svg.nocol .pl{transform:translate(-110px,0)}
.poly{flex:1.1;display:flex;flex-direction:column;align-items:center;gap:14px}.poly svg{width:auto;height:330px}
.poly input[type=range]{width:360px}
.poly input[type=range],input.rng{-webkit-appearance:none;appearance:none;height:24px;background:none;cursor:pointer}
.poly input[type=range]::-webkit-slider-runnable-track,input.rng::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
.poly input[type=range]::-webkit-slider-thumb,input.rng::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);border:0;margin-top:-9px}
.poly input[type=range]::-moz-range-track,input.rng::-moz-range-track{height:2px;background:var(--ink)}
.poly input[type=range]::-moz-range-thumb,input.rng::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:0}
.poly .cnt{font-family:var(--fm);font-size:18px}
.crop{border:2px solid var(--ink);border-radius:8px;background-repeat:no-repeat;width:100%;max-height:470px;align-self:center}
.kitui{display:grid;grid-template-columns:1fr 1.45fr .8fr;gap:22px;align-items:start}.kitui .col{display:flex;flex-direction:column;gap:12px}.kitui .crop{max-height:none}.kitui .cap{font-size:12px}
.games{display:grid;grid-template-columns:repeat(5,1fr);gap:16px 14px}.games .fig{gap:5px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;flex:1}.grid5 .shot{font-size:12px;padding:8px}
.part{justify-content:center}.part h1{font-size:110px}
.part .subs{margin-top:30px;display:flex;flex-wrap:wrap;gap:8px;max-width:1040px}
.part .subs span{font-family:var(--fm);font-size:13px;border:1.5px solid var(--ink);border-radius:999px;padding:5px 13px}
.wide{display:flex;flex-direction:column;justify-content:center;gap:22px;flex:1;min-height:0;padding-bottom:28px}
.wide>.fig:has(.img:not(.fit)){flex:1 1 auto!important}.wide>.vis{flex:0 0 auto;margin-top:8px}
.part .num{position:absolute;right:64px;top:150px;font-family:var(--fd);font-weight:900;font-size:220px;line-height:1;color:transparent;-webkit-text-stroke:2px var(--line)}
.dark{background:var(--ink);color:var(--paper)}.dark .k{color:#c9c9c4;border-color:#c9c9c4}.dark h1,.dark h2{color:var(--paper)}.dark h1 em,.dark h2 em{color:#c9c9c4}.dark .lead{color:#c9c9c4}
.hero{justify-content:center}.hero .me{position:absolute;right:40px;bottom:0;height:652px;width:auto;z-index:3;pointer-events:none}.hero .k{position:relative;z-index:1}
.hero .who{position:relative;z-index:2;max-width:620px;padding-bottom:30px}.hero h1{font-size:132px;line-height:.9}
.hero .say{font-size:40px!important;margin-top:40px;padding-top:24px;border-top:2px solid var(--ink);max-width:15ch!important}
.big{justify-content:center}.big h1{font-size:92px}.big h1.huge{font-size:200px;text-transform:uppercase;letter-spacing:-.03em;line-height:.9}
pre{font-family:var(--fm);font-size:15px;line-height:1.5;background:var(--ink);color:var(--paper);border-radius:var(--r);padding:16px 20px;white-space:pre}
.notes{display:none}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;background:#111;color:#eee;font:15px/1.5 var(--fb);padding:14px 22px;display:none;border-top:3px solid #fff}
#notes.on{display:block}#notes b{font-family:var(--fm);font-size:11px;letter-spacing:.15em;color:#aaa;display:block;margin-bottom:4px}
#bar{position:fixed;top:0;left:0;height:3px;background:#fff;transition:width .2s}
body.grid{overflow:auto}body.grid #stage{position:static;transform:none!important;width:auto;height:auto;display:grid;grid-template-columns:repeat(auto-fill,320px);gap:14px;padding:20px}
body.grid .s{display:flex;position:relative;width:1280px;height:720px;transform:scale(.25);transform-origin:0 0;margin:0 -960px -540px 0;cursor:pointer}
/* Moduli di simulazione esterni (slide-sim/*.js) */
.sim{align-items:center;justify-content:center}
.sim svg{max-height:400px}
.wide>.sim{flex:0 1 auto;min-height:0}
.wide>.sim svg{max-height:300px;width:auto;max-width:100%;margin:0 auto}
.sim .lbl{font-family:var(--fm);font-size:14px;text-align:center;margin-top:8px}
[data-s]{cursor:pointer}
.seg{display:flex;width:fit-content;max-width:100%;margin:14px auto 0;border:2px solid var(--ink);border-radius:var(--r);background:var(--paper);overflow:hidden}
.seg button,.seg>*{font-family:var(--fm);font-size:14px;padding:8px 16px;border:0;border-left:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.seg>:first-child{border-left:0}
.seg .on,.seg>.on{background:var(--ink);color:var(--paper)}
input.rng{width:100%;max-width:340px;display:block;margin:14px auto 0}
.cap-step{min-height:90px}
.pcol{display:flex;flex-direction:column;justify-content:center}.pcol .pns{flex:0 0 auto}.pcol .aside{margin-top:18px}
</style>
<script>window.SIM={};window.OVR={};</script>
<script>
(function(){
 var SIM=window.SIM,INK='#1b1b1b',PAP='#f4f4f1',G1='#e9e9e5',G2='#d2d2cc',G3='#8c8c8c',G4='#585858';

 /* ---------- branch: ognuno il suo ---------- */
 (function(){

/* ---------- motore ---------- */
const md=s=>String(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>');
const st=document.getElementById('stage');let chap=null;
function vis(v){if(!v)return'';if(v.shot)return`<div class="shot"><div><b>SCREENSHOT DA FARE</b>${v.shot}</div></div>`;
 const fig=(src,fit,cap,w,up)=>`<div class="fig" style="flex:${w||1}"><div class="img${fit?' fit':''}${up?' up':''}"><img src="${src}" alt=""></div>${cap?`<div class="cap">${cap}</div>`:''}</div>`;
 if(v.img)return fig(v.img,v.fit,v.cap||(v.src?FONTE:''),v.w,v.up);
 if(v.crop){const[x0,y0,x1,y1]=v.box,[W,H]=v.size,cw=(x1-x0)/W,ch=(y1-y0)/H;return`<div class="fig" style="flex:${v.w||1}"><div class="crop" style="aspect-ratio:${x1-x0}/${y1-y0};background-image:url('${v.crop}');background-size:${100/cw}% auto;background-position:${cw<1?x0/W/(1-cw)*100:0}% ${ch<1?y0/H/(1-ch)*100:0}%"></div></div>`}
 if(v.grid2)return`<div class="gridn" style="grid-template-columns:1fr 1fr">${v.grid2.map(([u,c,src])=>`<div class="fig"><div class="img" style="aspect-ratio:16/9;flex:0 0 auto"><img src="${u}" alt=""></div><div class="cap"><b style="color:var(--ink)">${c}</b>${src?' · '+src:''}</div></div>`).join('')}</div>`;
 if(v.games)return`<div class="games">${v.games.map(([n,id])=>`<div class="fig"><div class="img" style="aspect-ratio:460/215;flex:0 0 auto"><img src="https://cdn.cloudflare.steamstatic.com/steam/apps/${id}/header.jpg" alt="${n}"></div><div class="cap"><b style="color:var(--ink)">${n}</b></div></div>`).join('')}</div><div class="cap" style="margin-top:8px">Immagini: Steam</div>`;
 if(v.grid)return`<div class="gridn" style="grid-template-columns:repeat(${v.grid.length},1fr)">${v.grid.map(([u,c])=>fig(u,1,`<b style="color:var(--ink)">${c}</b> · ${FONTE}`)).join('')}</div>`;if(v.g)return`<div class="vis">${G[v.g]}</div>`;return`<div class="vis">${v.html}</div>`}
function body(o){let h='';(o.p||[]).forEach(x=>h+=`<p>${md(x)}</p>`);
 if(o.defs)h+='<dl class="defs">'+o.defs.map(([a,b])=>`<dt>${md(a)}</dt><dd>${md(b)}</dd>`).join('')+'</dl>';
 if(o.steps)h+='<div class="steps'+(o.cols?' cols':'')+'">'+o.steps.map(([a,b])=>`<div class="step"><h3>${md(a)}</h3><p>${md(b)}</p></div>`).join('')+'</div>';
 if(o.table)h+='<table><tr>'+o.table.h.map(x=>`<th>${x}</th>`).join('')+'</tr>'+o.table.r.map(r=>'<tr>'+r.map(c=>`<td>${md(c)}</td>`).join('')+'</tr>').join('')+'</table>';
 if(o.warn)h+=o.alert?`<div class="warn">${md(o.warn)}</div>`:`<p class="aside">${md(o.warn)}</p>`;return h}
/* ---------- slide a passi: frecce e clic portano allo stesso stato ---------- */
const inGrid=()=>document.body.classList.contains('grid');
const H2=o=>`<h2>${md(o.t.replace(/\*/g,''))}</h2>`;
function stepper(s,n,paint){s._steps=n;s._step=0;s._setStep=k=>{s._step=Math.max(0,Math.min(n,k));paint(s._step)};paint(0)}
const pnl=(h,on)=>`<div class="pn${on?' on':''}">${h}</div>`;
function areasHtml(a){const[W,H]=a.size;
 const bx=a.items.map(it=>{const[x0,y0,x1,y1]=it.box;return`<button type="button" class="ab" aria-label="${it.name}" style="left:${x0/W*100}%;top:${y0/H*100}%;width:${(x1-x0)/W*100}%;height:${(y1-y0)/H*100}%"></button>`}).join('');
 const ps=pnl(`<p class="p0">${md(a.intro)}</p>`,1)+a.items.map(it=>pnl(`<h3>${md(it.name)}</h3><p>${md(it.p)}</p>${it.aside?`<p class="aside">${md(it.aside)}</p>`:''}`)).join('');
 return`<div class="row"><div class="arimg"><div class="arz"><img src="${a.img}" alt="">${bx}</div></div><div class="pns">${ps}</div></div>`}
function mkAreas(s,a){const bs=[...s.querySelectorAll('.ab')],ps=[...s.querySelectorAll('.pn')],arz=s.querySelector('.arz'),[W,H]=a.size;
 /* Zoom: la finestra scelta riempie il riquadro (contain), centrata e senza uscire dall'immagine. */
 const zoom=n=>{if(!n){arz.style.transform='none';return}
  const[x0,y0,x1,y1]=a.items[n-1].box,k=Math.min(W/(x1-x0),H/(y1-y0)),cl=(t,k)=>Math.max(1-k,Math.min(0,t));
  const tx=cl(.5-k*(x0+x1)/2/W,k),ty=cl(.5-k*(y0+y1)/2/H,k);
  arz.style.transform=`translate(${tx*100}%,${ty*100}%) scale(${k})`};
 stepper(s,bs.length,n=>{bs.forEach((b,j)=>b.classList.toggle('sel',j===n-1));ps.forEach((p,j)=>p.classList.toggle('on',j===n));zoom(n)});
 bs.forEach((b,j)=>b.addEventListener('click',()=>{if(inGrid())return;s._setStep(j+1);b.blur()}))}
const PV=`<svg viewBox="0 0 280 270"><g class="flame" transform="translate(10.3 -11.3) scale(.2035)"><path fill="#1b1b1b" d="M437 311C475 338 520 372 546 432C556 420 558 405 551 391C590 415 614 470 614 535C614 595 578 635 531 650L455 655C395 630 366 585 366 525C366 470 425 430 443 372C449 352 446 330 437 311Z"/><path fill="#f4f4f1" d="M454 655C428 630 428 585 461 548C463 556 458 562 461 570C470 545 495 532 512 515C503 538 512 556 528 570C548 592 545 630 531 650Z"/></g><g class="mesh" fill="#e9e9e5" stroke="#1b1b1b" stroke-width="2"><path d="M60 120H160Q160 172 110 172Q60 172 60 120Z"/><rect x="97" y="172" width="26" height="55"/><rect x="78" y="227" width="64" height="12"/></g><rect class="col" x="50" y="48" width="120" height="196" fill="none" stroke="#1b1b1b" stroke-width="2" stroke-dasharray="7 5"/><text class="col" x="50" y="38">collider</text><g class="pl"><circle cx="228" cy="213" r="16" fill="#e9e9e5" stroke="#1b1b1b" stroke-width="2"/><text x="228" y="259" text-anchor="middle">player</text></g></svg>`;
function partsHtml(p,warn){const rows=p.items.map(it=>`<div class="r"><span class="cb ${it.cb?'x t':'sp'}"></span><span>${it.name}</span></div>`).join('');
 const ps=pnl(`<p>${md(p.intro)}</p>`,1)+p.items.map(it=>pnl(`<p>${md(it.p)}</p>`)).join('');
 return`<div class="pt"><div class="comp"><span class="cap" style="font-weight:700;color:#1b1b1b">${p.head}</span>${rows}</div><div class="pv">${PV}</div><div class="pcol"><div class="pns">${ps}</div>${warn?body({warn}):''}</div></div>`}
function mkParts(s){const rows=[...s.querySelectorAll('.comp .r')],cbs=[...s.querySelectorAll('.cb.x')],pv=s.querySelector('.pv svg'),ps=[...s.querySelectorAll('.pn')];let en=[1,1,1];
 const paint=n=>{rows.forEach((r,j)=>r.classList.toggle('on',j===n-1));cbs.forEach((c,j)=>c.classList.toggle('t',!!en[j]));['nomesh','nocol','nosw'].forEach((c,j)=>pv.classList.toggle(c,!en[j]));ps.forEach((p,j)=>p.classList.toggle('on',j===n))};
 stepper(s,rows.length,n=>{en=[1,1,1];if(n>=2)en[n-2]=0;paint(n)});
 rows.forEach((r,j)=>r.addEventListener('click',()=>{if(!inGrid())s._setStep(j+1)}));
 cbs.forEach((c,j)=>c.addEventListener('click',e=>{if(inGrid())return;e.stopPropagation();en[j]=en[j]?0:1;paint(s._step)}))}
/* Moduli SIM esterni: SIM[name]={steps,html,set(root,step),enter?(root),leave?(root)}. Ogni chiamata è protetta da try/catch. */
function simHtml(o){const m=(window.SIM||{})[o.sim];
 if(!m)return`<div class="solo">${body({p:o.p,warn:o.warn,alert:o.alert})}</div>`;
 let t=(o.p||[]).map(x=>`<p>${md(x)}</p>`).join('');
 if(o.caps)t+=`<p class="cap-step">${md(o.caps[0]||'')}</p>`;
 if(o.warn)t+=o.alert?`<div class="warn">${md(o.warn)}</div>`:`<p class="aside">${md(o.warn)}</p>`;
 const v=`<div class="vis sim" data-sim="${o.sim}"${o.simw&&!o.wide?` style="flex:${o.simw}"`:''}>${m.html}</div>`;
 return o.wide?`<div class="wide">${v}<div>${t}</div></div>`:`<div class="row">${v}<div class="txt">${t}</div></div>`}
function mkSim(s,o){const m=(window.SIM||{})[o.sim];if(!m)return;
 const root=s.querySelector('.sim'),cap=s.querySelector('.cap-step'),n=m.steps|0;
 const call=(f,...a)=>{try{if(typeof m[f]==='function')m[f](root,...a)}catch(e){console.error('SIM '+o.sim+'.'+f,e)}};
 const rng=root.querySelector('input.rng');if(rng){rng.min=0;rng.max=n;rng.step=1;rng.value=0}
 s._simEnter=()=>call('enter');s._simLeave=()=>call('leave');
 stepper(s,n,k=>{root.querySelectorAll('[data-s]').forEach(e=>e.classList.toggle('on',+e.dataset.s===k));
  if(rng)rng.value=k;
  if(cap&&o.caps){cap.innerHTML=md(o.caps[k]||'');if(cap.textContent.trim().split(/\s+/).length>=5)glueTail(cap,2)}
  call('set',k)});
 root.addEventListener('click',e=>{const t=e.target.closest('[data-s]');if(t&&root.contains(t)&&!inGrid()){s._setStep(+t.dataset.s);t.blur()}});
 if(rng){rng.addEventListener('input',()=>{if(!inGrid())s._setStep(+rng.value)});rng.addEventListener('change',()=>rng.blur())}}
/* Sfera UV: proiezione ortogonale con inclinazione, back faces scartate, grigio piatto da un termine di Lambert. */
const SEG=[4,6,8,12,16,24,32,48];
function sphereSvg(seg){const rings=seg/2,T=Math.PI/9,Y=.5,cT=Math.cos(T),sT=Math.sin(T),cY=Math.cos(Y),sY=Math.sin(Y),R=170;
 const rot=(x,y,z)=>{const a=x*cY+z*sY,c=-x*sY+z*cY;return[a,y*cT-c*sT,y*sT+c*cT]};
 const V=[];for(let r=0;r<=rings;r++){const th=Math.PI*r/rings,row=[];for(let k=0;k<seg;k++){const ph=2*Math.PI*k/seg;row.push(rot(Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph)))}V.push(row)}
 const Ln=Math.hypot(-.45,.65,.62),L=[-.45/Ln,.65/Ln,.62/Ln],out=[];
 const tri=(a,b,c)=>{const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
  if(n[0]*(a[0]+b[0]+c[0])+n[1]*(a[1]+b[1]+c[1])+n[2]*(a[2]+b[2]+c[2])<0)n=n.map(x=>-x);
  if(n[2]<=1e-9)return;const l=Math.hypot(...n),t=Math.max(0,(n[0]*L[0]+n[1]*L[1]+n[2]*L[2])/l);
  const f=(lo,hi)=>Math.round(lo+(hi-lo)*t),pt=q=>(200+R*q[0]).toFixed(1)+','+(200-R*q[1]).toFixed(1);
  out.push(`<polygon points="${pt(a)} ${pt(b)} ${pt(c)}" fill="rgb(${f(58,244)},${f(58,244)},${f(58,241)})"/>`)};
 for(let r=0;r<rings;r++)for(let k=0;k<seg;k++){const k1=(k+1)%seg,a=V[r][k],b=V[r][k1],c=V[r+1][k1],d=V[r+1][k];
  if(r===0)tri(a,c,d);else if(r===rings-1)tri(a,b,d);else{tri(a,b,c);tri(a,c,d)}}
 return`<svg viewBox="0 0 400 400"><g stroke="#1b1b1b" stroke-width="1" stroke-linejoin="round">${out.join('')}</g></svg>`}
const polyHtml=()=>`<div class="poly"><div class="sph"></div><input type="range" min="0" max="${SEG.length-1}" step="1" value="0" aria-label="Detail level"><div class="cnt"></div></div>`;
function mkPoly(s){const sph=s.querySelector('.sph'),inp=s.querySelector('.poly input'),cnt=s.querySelector('.cnt');
 stepper(s,SEG.length-1,n=>{const g=SEG[n];sph.innerHTML=sphereSvg(g);inp.value=n;cnt.textContent='Triangles: '+2*g*(g/2-1)});
 inp.addEventListener('input',()=>{if(!inGrid())s._setStep(+inp.value)});inp.addEventListener('change',()=>inp.blur())}
/* Override: window.OVR[k]===null toglie la slide k, altrimenti la sostituisce. Prima di calcolare subs. */
for(const k in (window.OVR||{})){const v=window.OVR[k],ix=D.findIndex(o=>o.k===k);if(ix<0)continue;if(v===null)D.splice(ix,1);else D[ix]=v}
const subs={};let cur;D.forEach(o=>{if(o.ch)cur=o.ch;else if(o.k&&cur)(subs[cur]=subs[cur]||[]).push(o)});
D.forEach(o=>{const s=document.createElement('section');s.className='s';let h='';
 if(o.cover){s.classList.add('part');h=`<div class="k"><span>Digital Heritage · Pantheon</span><span>12 novembre 2026</span></div><h1>${o.h1}</h1><p class="lead" style="margin-top:28px">${o.lead}</p>`}
 else if(o.pause){s.classList.add('part','dark');h=`<div class="k"><span>Digital Heritage · Pantheon</span><span></span></div><h1>Pausa</h1>`}
 else if(o.ch){chap=o;s.classList.add('part','dark');h=`<div class="k"><span>Capitolo ${o.ch}</span><span></span></div><h1>${md(o.t)}</h1>`}
 else{if(o.dark)s.classList.add('dark');if(o.big)s.classList.add('big');
  h=`<div class="k"><span>${chap?chap.ch+' · '+chap.t.replace(/\*/g,''):o.t}</span><span></span></div>`;s.dataset.k=o.k;
  if(o.hero){s.classList.add('hero');h+=`<img class="me" src="${o.hero}" alt=""><div class="who"><h1>${o.name[0]}<br><em>${o.name[1]}</em></h1><p class="say">${md(o.say)}</p></div>`}
  else if(o.huge)h+=`<h1 class="huge">${md(o.t)}</h1>`;else if(o.big)h+=`<h1>${md(o.t)}</h1><p class="lead" style="margin-top:26px;max-width:44ch">${md((o.p||[''])[0])}</p>`;
  else if(o.say){h+=`<h2>${md(o.t.replace(/\*/g,''))}</h2><div class="solo"><p class="say">${md(o.say)}</p></div>`;o.n=[...(o.p||[]),o.warn||'',o.n||''].filter(Boolean).join(' ')}
  else if(o.areas)h+=H2(o)+areasHtml(o.areas);
  else if(o.sim)h+=H2(o)+simHtml(o);
  else if(o.parts)h+=H2(o)+`<div class="wide">${partsHtml(o.parts,o.warn)}</div>`;
  else if(o.poly)h+=H2(o)+`<div class="row">${polyHtml()}<div class="txt">${body(o)}</div></div>`;
  else{h+=H2(o);const v=vis(o.vis),b=body(o);
   if(!v)h+=`<div class="solo">${b}</div>`;
   else if(o.wide)h+=`<div class="wide">${v}<div>${b}</div></div>`;
   else h+=`<div class="row">${v}<div class="txt">${b}</div></div>`}}
 if(o.ch&&o.min)o.n=`Tempo previsto: ${o.min} minuti.`+(o.n?' '+o.n:'');
 if(o.pause)o.n='Pausa di 10 minuti.';
 if(o.n)h+=`<div class="notes">${o.n}</div>`;s.innerHTML=h;st.appendChild(s);
 if(o.areas)mkAreas(s,o.areas);if(o.parts)mkParts(s);if(o.poly)mkPoly(s);if(o.sim)mkSim(s,o)});

const S=[...document.querySelectorAll('.s')],nb=document.getElementById('notes'),bar=document.getElementById('bar');
let i=0;try{i=Math.min(S.length-1,+(location.hash.slice(1)||1)-1)||0}catch(e){}
S.forEach((s,k)=>s.dataset.n=(k+1)+' / '+S.length);
function fit(){const r=Math.min(innerWidth/1280,innerHeight/720);st.style.transform=`translate(-50%,-50%) scale(${r})`}
function show(n,back){const o=i;i=Math.max(0,Math.min(S.length-1,n));
 if(o!==i&&S[o]._simOn){S[o]._simOn=0;S[o]._simLeave()}
 S.forEach((s,k)=>s.classList.toggle('on',k===i));
 const c=S[i];if(c._simEnter&&!c._simOn){c._simOn=1;c._simEnter()}
 if(i!==o&&c._setStep)c._setStep(back?c._steps:0);else if(c._simEnter)c._setStep(c._step);
 const t=S[i].querySelector('.notes');nb.innerHTML='<b>NOTE DEL DOCENTE · '+(i+1)+'</b>'+(t?t.innerHTML:'—');
 bar.style.width=((i+1)/S.length*100)+'%';try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
function next(){const s=S[i];if(s._steps&&s._step<s._steps)s._setStep(s._step+1);else show(i+1)}
function prev(){const s=S[i];if(s._steps&&s._step>0)s._setStep(s._step-1);else show(i-1,1)}
addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT')return;
 if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}
 else if(['ArrowLeft','PageUp'].includes(e.key))prev();
 else if(e.key==='n'||e.key==='N')nb.classList.toggle('on');
 else if(e.key==='g'||e.key==='G'){if(document.body.classList.toggle('grid'))S.forEach(s=>s._setStep&&s._setStep(0));fit()}
 else if(e.key==='Home')show(0);else if(e.key==='End')show(S.length-1)});
S.forEach((s,k)=>s.addEventListener('click',()=>{if(document.body.classList.contains('grid')){document.body.classList.remove('grid');show(k);fit()}}));
/* Niente parole vedove: a capo dopo i ":" se la frase va su più righe, e le ultime parole restano unite. */
const TXT='p, dd, .aside, .warn, .step p, td';
function lines(el){const lh=parseFloat(getComputedStyle(el).lineHeight)||20;return Math.round(el.offsetHeight/lh)}
function textNodes(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('code')?2:1});const a=[];while(w.nextNode())a.push(w.currentNode);return a}
function colonBreak(el){if(lines(el)<2)return;for(const n of textNodes(el)){const k=n.data.indexOf(': ');if(k<0)continue;
 const rest=el.textContent.slice(el.textContent.indexOf(n.data)+k+2).trim().split(/\s+/).length;if(rest<3)return;
 const after=n.splitText(k+1);after.data=after.data.replace(/^\s+/,'');n.parentNode.insertBefore(document.createElement('br'),after);return}}
function glueTail(el,count){const ns=textNodes(el).filter(n=>n.data.trim());let left=count;
 for(let j=ns.length-1;j>=0&&left>0;j--){const d=ns[j].data.replace(/\s+$/,'');let out=d,idx=d.length;
  while(left>0){const sp=out.lastIndexOf(' ',idx-1);if(sp<=0)break;out=out.slice(0,sp)+' '+out.slice(sp+1);idx=sp;left--}
  ns[j].data=out+ns[j].data.slice(d.length);if(left>0&&j>0&&/\s$/.test(ns[j-1].data)){ns[j-1].data=ns[j-1].data.replace(/\s+$/,' ');left--}}}
function fixText(s){s.querySelectorAll(TXT).forEach(el=>{if(el.closest('.notes')||el.closest('.sim'))return;
 if(el.matches('p, dd, .aside, .warn')&&!el.classList.contains('say')&&!el.closest('.pn'))colonBreak(el);
 if(el.textContent.trim().split(/\s+/).length>=5)glueTail(el,el.classList.contains('say')?1:2)})}
addEventListener('resize',fit);fit();
document.fonts.ready.then(()=>{S.forEach(s=>{const on=s.classList.contains('on');s.classList.add('on');fixText(s);if(!on)s.classList.remove('on')});show(i)});
show(i);
</script>
